<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — FlareWatch</title>
  <style>
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 300 800;
      font-display: swap;
      src: url('/fonts/dm-sans.woff2') format('woff2');
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #FFF8F4; color: #1A1614;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 40px 24px; text-align: center;
    }
    .wrap { max-width: 420px; }
    .logo { font-size: 1rem; font-weight: 700; color: #C8502B; text-decoration: none; display: inline-block; margin-bottom: 48px; }
    .code { font-size: 6rem; font-weight: 800; color: #EDE5DF; line-height: 1; letter-spacing: -4px; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 0.95rem; color: #7A706B; line-height: 1.6; margin-bottom: 32px; }
    .btn {
      display: inline-block; background: #C8502B; color: #fff;
      padding: 12px 28px; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
      text-decoration: none; transition: background 0.15s;
    }
    .btn:hover { background: #A8401E; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="logo" href="/">FlareWatch</a>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a class="btn" href="/">Go home</a>
  </div>
</body>
</html>
