<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#FCEEE5"/>
  <rect width="1200" height="630" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCEEE5"/>
      <stop offset="100%" stop-color="#FFF8F4"/>
    </linearGradient>
  </defs>
  <!-- Wordmark -->
  <text x="96" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="72" font-weight="700" letter-spacing="-2" fill="#C8502B">FlareWatch</text>
  <!-- Tagline -->
  <text x="96" y="338" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
